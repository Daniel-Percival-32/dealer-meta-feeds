name: Build Meta vehicle feeds

on:
  schedule:
    # Spare slots only: GitHub skips most of them. hourly-tick.yml is the real clock.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "Publish even if more than half the vehicles disappeared"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: build-feeds
  cancel-in-progress: false

jobs:
  chestnut-wav-centre:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch the last published feeds
        run: |
          mkdir -p feeds "$RUNNER_TEMP/previous"
          git fetch -q --depth=1 origin feed 2>/dev/null || true
          for f in chestnut-wav-centre.csv chestnut-wav-centre-vopple.csv; do
            if git show FETCH_HEAD:$f > feeds/$f 2>/dev/null; then
              cp feeds/$f "$RUNNER_TEMP/previous/$f"
            else
              rm -f feeds/$f
            fi
          done

      - name: Build feed from CarDealer5 stock
        env:
          CD5_API_KEY: ${{ secrets.CD5_API_KEY_CHESTNUT }}
          ALLOW_DROP: ${{ inputs.allow_drop && '1' || '0' }}
        run: |
          set -o pipefail
          python3 build_feed.py dealers/chestnut-wav-centre.json \
            feeds/chestnut-wav-centre.csv feeds/chestnut-wav-centre-vopple.csv | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish to the feed branch if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if diff -rq "$RUNNER_TEMP/previous" feeds >/dev/null; then
            echo "No stock change" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          out="$(mktemp -d)"
          cp feeds/*.csv "$out/"
          cd "$out"
          git init -q -b feed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.csv
          git commit -q -m "Chestnut WAV Centre feed"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" feed
          echo "Published" | tee -a "$GITHUB_STEP_SUMMARY"
