name: Build Meta vehicle feeds

on:
  schedule:
    # Spare slots only: GitHub skips most of them. hourly-tick.yml is the real clock.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "Publish even if more than half the vehicles disappeared"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: build-feeds
  cancel-in-progress: false

jobs:
  chestnut-wav-centre:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Fetch the last published feed
        run: |
          mkdir -p feeds
          if git fetch -q --depth=1 origin feed 2>/dev/null \
             && git show FETCH_HEAD:chestnut-wav-centre.csv > feeds/chestnut-wav-centre.csv; then
            cp feeds/chestnut-wav-centre.csv "$RUNNER_TEMP/previous.csv"
          else
            rm -f feeds/chestnut-wav-centre.csv
          fi

      - name: Build feed from CarDealer5 stock
        env:
          CD5_API_KEY: ${{ secrets.CD5_API_KEY_CHESTNUT }}
          ALLOW_DROP: ${{ inputs.allow_drop && '1' || '0' }}
        run: python3 build_feed.py dealers/chestnut-wav-centre.json feeds/chestnut-wav-centre.csv | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish to the feed branch if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/previous.csv" ] && cmp -s "$RUNNER_TEMP/previous.csv" feeds/chestnut-wav-centre.csv; then
            echo "No stock change" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          out="$(mktemp -d)"
          cp feeds/chestnut-wav-centre.csv "$out/"
          cd "$out"
          git init -q -b feed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chestnut-wav-centre.csv
          git commit -q -m "Chestnut WAV Centre feed"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" feed
          echo "Published" | tee -a "$GITHUB_STEP_SUMMARY"
